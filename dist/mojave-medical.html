<title>Mojave Medical</title>
<meta name="description" content="Mojave Medical is the Apple Valley, California practice of Kevin N. Ganesh, MD, board-certified in Infectious Disease and Internal Medicine. Wound and bone infections, HIV, hepatitis, Valley Fever, travel medicine and primary care. Book online or call (760) 688-0084.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral+SC:wght@500;600&family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500&display=swap">
<style>
/* ============ Tokens ============ */
:root{
  --ink:#10202F; --ink-2:#2B3F52; --mute:#5F6B78;
  --ground:#F8F7F4; --surface:#FFFFFF; --sand:#EFEBE3; --sand-2:#E6E0D4; --line:#DDD8CF; --line-2:#CBC4B8;
  --amber:#FEBD5A; --amber-2:#FFCB78; --amber-deep:#8A5A0E; --amber-soft:#FFF1DA;
  --sage:#2F6B5B; --sage-soft:#E3EFEA;
  --danger:#A63D2F;
  --on-ink:#F8F7F4; --on-amber:#10202F;
  --shadow:0 1px 2px rgba(16,32,47,.05),0 12px 32px -16px rgba(16,32,47,.18);
  --shadow-lg:0 2px 4px rgba(16,32,47,.06),0 24px 48px -20px rgba(16,32,47,.28);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sc:"Spectral SC","Spectral",Georgia,serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-lg:20px;
  --wrap:1280px;
  --logo-font:"Montserrat",var(--sans);
  --logo-grey:#BCBCBC; --logo-grey2:#989898; --logo-grey3:#BEBEBE; --logo-grey4:#B1B1B1; --logo-grey5:#858585; --logo-white:#F5F5F5;
  --logo-text:#737373; --logo-tag:#8C8C8C; --logo-name:#161616;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EDEAE3; --ink-2:#C9C3B8; --mute:#9AA3AE;
    --ground:#0D1822; --surface:#142230; --sand:#1A2B3B; --sand-2:#213547; --line:#27394B; --line-2:#354A5F;
    --amber:#FEBD5A; --amber-2:#FFCB78; --amber-deep:#F5C776; --amber-soft:#2E2A1E;
    --sage:#7FC3AB; --sage-soft:#16302A;
    --danger:#E48A7C;
    --on-ink:#0D1822; --on-amber:#10202F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -20px rgba(0,0,0,.7);
    --logo-grey:#7C8794; --logo-grey2:#4C5866; --logo-grey3:#8A94A0; --logo-grey4:#5F6B78; --logo-grey5:#9AA3AE; --logo-white:#F5F5F5;
    --logo-text:#C9C3B8; --logo-tag:#9AA3AE; --logo-name:#EDEAE3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEAE3; --ink-2:#C9C3B8; --mute:#9AA3AE;
  --ground:#0D1822; --surface:#142230; --sand:#1A2B3B; --sand-2:#213547; --line:#27394B; --line-2:#354A5F;
  --amber:#FEBD5A; --amber-2:#FFCB78; --amber-deep:#F5C776; --amber-soft:#2E2A1E;
  --sage:#7FC3AB; --sage-soft:#16302A;
  --danger:#E48A7C;
  --on-ink:#0D1822; --on-amber:#10202F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -20px rgba(0,0,0,.7);
  --logo-grey:#7C8794; --logo-grey2:#4C5866; --logo-grey3:#8A94A0; --logo-grey4:#5F6B78; --logo-grey5:#9AA3AE; --logo-white:#F5F5F5;
  --logo-text:#C9C3B8; --logo-tag:#9AA3AE; --logo-name:#EDEAE3;
  color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
@media (max-width:800px){body{padding-bottom:76px}}
img{max-width:100%;display:block}
svg.i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em}
a svg.i,button svg.i,summary svg.i,li svg.i,span svg.i{flex:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.15em}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(2.4rem,1.2rem + 3.6vw,4.1rem)}
h2{font-size:clamp(1.85rem,1.2rem + 1.9vw,2.7rem)}
h3{font-size:1.45rem}
h4{font-size:1.15rem;font-family:var(--sans);font-weight:600}
p{margin:0}
.lede{font-size:1.2rem;line-height:1.5;color:var(--ink-2);max-width:60ch}
.measure{max-width:64ch}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-deep);font-weight:500;display:inline-flex;align-items:center;gap:.6em}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--amber);display:inline-block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:.9rem;color:var(--mute)}
.muted{color:var(--mute)}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(1rem,4vw,2.5rem)}
.section{padding-block:clamp(3rem,7vw,5.5rem)}
.section-tight{padding-block:clamp(2rem,5vw,3.5rem)}
.section-head{display:flex;flex-direction:column;gap:.9rem;margin-bottom:clamp(1.8rem,4vw,2.8rem);max-width:70ch}
.section-head h2{margin-top:.1rem}
.flex{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:1rem}
.grid{display:grid;gap:1.25rem}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--on-ink);padding:.6rem 1rem;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.85rem 1.35rem;border-radius:var(--r);font:600 1rem/1 var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ink:hover{box-shadow:var(--shadow)}
.btn-amber{background:var(--amber);color:var(--on-amber)}
.btn-amber:hover{background:var(--amber-2);box-shadow:0 8px 24px -10px rgba(254,189,90,.75)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);background:var(--surface)}
.btn-sm{padding:.6rem 1rem;font-size:.92rem}
.btn-lg{padding:1.05rem 1.6rem;font-size:1.08rem}
.btn svg{width:1.1em;height:1.1em;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ============ Header ============ */
.site-head{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:1rem;min-height:74px;min-width:0}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;flex:0 1 auto;min-width:0}
.brand-shield{width:48px;height:63px;flex:none;display:block}
.brand-shield img{width:100%;height:100%;object-fit:contain;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.wordmark{font-family:var(--logo-font);font-weight:400;font-size:1.12rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);display:inline-flex;align-items:center;white-space:nowrap;line-height:1}
.wordmark>span:first-child{letter-spacing:0}
.wordmark .virus-o{display:inline-block;width:1.42em;height:1.42em;margin:0 .17em 0 .13em;position:relative;top:.01em;flex:none}
.wordmark .virus-o img{width:100%;height:100%;object-fit:contain;display:block}
.brand-sub{font-family:var(--logo-font);font-weight:500;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-top:.34rem;white-space:nowrap}
.nav{display:flex;gap:.1rem;margin-inline:auto;min-width:0}
.nav a{padding:.55rem .8rem;border-radius:8px;text-decoration:none;font-weight:500;font-size:.96rem;color:var(--ink-2);position:relative;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sand)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:.2rem;height:2px;background:var(--amber);border-radius:2px}
.head-actions{display:flex;align-items:center;gap:.55rem;flex:none;margin-left:auto}
.call-link{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.9rem;text-decoration:none;color:var(--ink);padding:.5rem .7rem;border-radius:8px}
.call-link:hover{background:var(--sand)}
.call-link svg{width:1em;height:1em;color:var(--amber-deep)}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:.78rem}
.lang button{background:transparent;border:0;padding:.45rem .6rem;color:var(--mute);cursor:pointer;font:inherit;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.menu-btn{display:none;background:transparent;border:1px solid var(--line-2);border-radius:8px;width:42px;height:42px;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.menu-btn svg{width:22px;height:22px}
@media (max-width:1400px){.head-actions .call-link{display:none}}
@media (max-width:1080px){
  .nav{display:none}
  .menu-btn{display:inline-flex}
  .site-head.open .nav{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);padding:.75rem clamp(1rem,4vw,2.5rem) 1rem;box-shadow:var(--shadow-lg)}
  .site-head.open .nav a{padding:.8rem .6rem;font-size:1.05rem;border-bottom:1px solid var(--line)}
  .site-head.open .nav a[aria-current="page"]::after{display:none}
  .head-actions .call-link,.head-actions .btn{display:none}
}
@media (max-width:480px){.brand-sub{display:none}.wordmark{font-size:.92rem;letter-spacing:.16em}.brand-shield{width:36px;height:47px}}

/* ============ Hero ============ */
.hero{padding-block:clamp(2.2rem,6vw,4.5rem) clamp(2.5rem,6vw,4rem);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:1.4rem}
.hero h1 .dot{color:var(--amber-deep);font-style:italic}
.hero-ctas{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.42rem .75rem;border:1px solid var(--line-2);border-radius:999px;font-size:.86rem;background:var(--surface);color:var(--ink-2)}
.chip svg{width:14px;height:14px;color:var(--sage);flex:none}
.portrait{position:relative;aspect-ratio:4/5;max-width:440px;margin-inline:auto;width:100%}
.portrait .sand{position:absolute;inset:8% -6% -4% 6%;background:var(--sand);border-radius:var(--r-lg);z-index:0}
.portrait .ring{position:absolute;width:38%;aspect-ratio:1;border:2px solid var(--amber);border-radius:50%;right:-9%;top:-3%;z-index:0;opacity:.9}
.portrait .ring::after{content:"";position:absolute;inset:14%;border-radius:50%;background:var(--amber);opacity:.16}
.portrait>img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:220px 220px var(--r-lg) var(--r-lg);box-shadow:var(--shadow-lg);filter:saturate(.96)}
.portrait .tag{position:absolute;z-index:2;left:-4%;bottom:9%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem 1rem .7rem .8rem;box-shadow:var(--shadow);display:flex;gap:.85rem;align-items:center;max-width:82%}
.portrait .tag .mark{width:58px;height:77px;flex:none;object-fit:contain;object-position:center;display:block;border-radius:0;box-shadow:none;filter:none}
.portrait .tag b{display:block;font-size:.92rem;font-weight:600;line-height:1.2}
.portrait .tag span{font-size:.78rem;color:var(--mute);font-family:var(--mono);letter-spacing:.02em}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .portrait{max-width:340px;order:-1}
  .portrait .tag{left:0}
}

/* ============ Affiliation strip ============ */
.strip{border-block:1px solid var(--line);background:var(--surface)}
.strip-row{display:grid;grid-template-columns:auto 1fr;gap:1.25rem 2rem;align-items:center;padding-block:1.1rem}
.strip-row+.strip-row{border-top:1px solid var(--line)}
.strip-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.strip-items{display:flex;flex-wrap:wrap;gap:.5rem 2rem}
.strip-items span{font-family:var(--serif);font-size:1.12rem;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:.55rem}
.strip-items span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
@media (max-width:700px){.strip-row{grid-template-columns:1fr;gap:.6rem}}

/* ============ Bento ============ */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:1rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.35rem;display:flex;flex-direction:column;gap:.6rem;position:relative;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;text-decoration:none;color:inherit}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.tile h3{font-size:1.28rem}
.tile p{color:var(--ink-2);font-size:.97rem}
.tile .ico{width:38px;height:38px;border-radius:10px;background:var(--amber-soft);color:var(--amber-deep);display:grid;place-items:center;margin-bottom:.3rem}
.tile .ico svg{width:20px;height:20px}
.tile-big{grid-column:span 2;grid-row:span 2;background:var(--ink);color:var(--on-ink);border-color:var(--ink);justify-content:space-between;overflow:hidden}
.tile-big p{color:color-mix(in srgb,var(--on-ink) 78%,transparent)}
.tile-big h3{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);max-width:16ch}
.tile-big .ico{background:color-mix(in srgb,var(--on-ink) 10%,transparent);color:var(--amber)}
.tile-big .sun{position:absolute;right:-70px;bottom:-90px;width:280px;height:280px;color:var(--amber);opacity:.28;pointer-events:none}
.tile-big .list{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.tile-big .list span{font-size:.8rem;padding:.3rem .6rem;border:1px solid color-mix(in srgb,var(--on-ink) 28%,transparent);border-radius:999px;color:color-mix(in srgb,var(--on-ink) 85%,transparent)}
.tile-sand{background:var(--sand);border-color:var(--sand-2)}
.tile-wide{grid-column:span 2}
.tile .more{margin-top:auto;font-size:.88rem;font-weight:600;color:var(--amber-deep);display:inline-flex;gap:.35rem;align-items:center}
.more svg,.btn-sm svg{width:1em;height:1em;flex:none}
.tile-big .more{color:var(--amber)}
@media (max-width:980px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-big{grid-column:span 2;grid-row:span 1;min-height:280px}}
@media (max-width:520px){.bento{grid-template-columns:1fr}.tile-big,.tile-wide{grid-column:span 1}}

/* ============ Steps ============ */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;counter-reset:step}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem;display:flex;flex-direction:column;gap:.7rem;position:relative}
.step::before{counter-increment:step;content:counter(step,decimal-leading-zero);font-family:var(--mono);font-size:.8rem;color:var(--amber-deep);letter-spacing:.1em}
.step h3{font-size:1.3rem}
.step p{color:var(--ink-2);font-size:.97rem}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

/* ============ Credentials / about preview ============ */
.cred{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
.cred-photo{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/4.6;background:var(--sand)}
.cred-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;margin-top:1.4rem}
.fact{border-top:2px solid var(--line-2);padding-top:.8rem;display:flex;flex-direction:column;gap:.25rem}
.fact b{font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.25}
.fact span{font-size:.88rem;color:var(--mute)}
.fact.amber{border-top-color:var(--amber)}
@media (max-width:860px){.cred{grid-template-columns:1fr}.cred-photo{max-width:380px}}
@media (max-width:520px){.facts{grid-template-columns:1fr}}

/* ============ Quotes ============ */
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.quote .q{font-family:var(--serif);font-size:1.15rem;line-height:1.45;color:var(--ink)}
.quote .q::before{content:"\201C";color:var(--amber);font-size:1.6em;line-height:0;vertical-align:-.3em;margin-right:.1em}
.quote .who{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.88rem;color:var(--mute);margin-top:auto}
.quote .who b{color:var(--ink);font-weight:600}
.stars{color:var(--amber);letter-spacing:.05em;font-size:.95rem}
.rating-card{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1.4rem}
.rating-card .big{font-family:var(--serif);font-size:3rem;line-height:1;font-weight:500}
@media (max-width:860px){.quotes{grid-template-columns:1fr}}

/* ============ Insurance ============ */
.carriers{display:flex;flex-wrap:wrap;gap:.55rem}
.carriers span{padding:.55rem .9rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500;font-size:.95rem}

/* ============ Location ============ */
.loc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem}
.card h3{margin-bottom:.9rem}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.97rem}
.hours td:last-child{text-align:right;font-family:var(--mono);font-size:.9rem}
.hours tr.today td{color:var(--amber-deep);font-weight:600}
.hours tr:last-child td{border-bottom:0}
.addr{font-style:normal;line-height:1.5}
.addr b{font-family:var(--serif);font-weight:500;font-size:1.15rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;font-size:.97rem;margin-top:1rem}
.kv dt{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:.2rem}
.kv dd{margin:0}
.map{background:var(--sand);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative;min-height:340px;display:flex;flex-direction:column}
.map-link{display:flex;flex:1;min-height:260px;position:relative;text-decoration:none;color:inherit;cursor:pointer}
.map-link::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:0;transition:opacity .18s}
.map-link:hover::after{opacity:.045}
.clinic{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--sand);margin-bottom:1.25rem}
.clinic img{width:100%;height:clamp(240px,34vw,440px);object-fit:cover;object-position:50% 16%;display:block}

      { q: { en: "Do I need a referral?", es: "¿Necesito una referencia?" }, a: { en: "If you have an HMO plan (for example through IEHP, Health Net or Blue Shield HMO), yes, your primary care doctor sends us a referral. Medicare, PPO and self-pay patients can book directly.", es: "Si tiene un plan HMO (por ejemplo IEHP, Health Net o Blue Shield HMO), sí: su médico de cabecera nos envía la referencia. Con Medicare, PPO o pago directo puede reservar directamente." } },

      { q: { en: "Do you see patients from Barstow, Lucerne Valley or Hesperia?", es: "¿Atienden pacientes de Barstow, Lucerne Valley o Hesperia?" }, a: { en: "Yes. Many patients drive in from across the High Desert, and video visits can replace some of the follow-up trips.", es: "Sí. Muchos pacientes vienen de todo el High Desert, y las consultas por video pueden reemplazar algunos viajes de seguimiento." } },
      { q: { en: "What if I have an emergency after hours?", es: "¿Qué hago si tengo una emergencia fuera de horario?" }, a: { en: "Call 911 or go to the nearest emergency room. Dr. Ganesh is on the medical staff at St. Mary, Desert Valley and Victor Valley Global, and can be consulted there.", es: "Llame al 911 o vaya a la sala de emergencias más cercana. El Dr. Ganesh forma parte del personal médico de St. Mary, Desert Valley y Victor Valley Global, y puede ser consultado allí." } },

  legal: {
    privacy: {
      lede: { en: "What this website collects, why, and who can see it.", es: "Qué recopila este sitio web, por qué y quién puede verlo." },
      sections: [
        { h: { en: "What we collect", es: "Qué recopilamos" }, p: { en: "When you request an appointment we ask for your name, date of birth, phone number, an optional email address, your insurance carrier, whether you have seen Dr. Ganesh before, who referred you, and a short reason for the visit. That is all. Browsing the rest of the site collects nothing about you.", es: "Cuando solicita una cita le pedimos su nombre, fecha de nacimiento, teléfono, un correo electrónico opcional, su aseguradora, si ya ha visto al Dr. Ganesh, quién lo refirió y un motivo breve de la visita. Eso es todo. Navegar el resto del sitio no recopila nada sobre usted." } },
        { h: { en: "How it is stored", es: "Cómo se guarda" }, p: { en: "Your request travels over an encrypted connection and is stored on a server controlled by the practice, not by a third-party form service. Only front-desk staff and Dr. Ganesh can view it, after signing in. Every view and change is logged.", es: "Su solicitud viaja por una conexión cifrada y se guarda en un servidor controlado por el consultorio, no por un servicio de formularios externo. Solo el personal de recepción y el Dr. Ganesh pueden verla, después de iniciar sesión. Cada consulta y cambio queda registrado." } },
        { h: { en: "Email and text messages", es: "Correo y mensajes de texto" }, p: { en: "Staff are notified of a new request by an email that contains only a reference number. Your details are never sent by email. If you give us an email address we send you a short acknowledgement with your reference number and nothing else.", es: "El personal recibe un correo con solo un número de referencia. Sus datos nunca se envían por correo. Si nos da un correo electrónico, le enviamos un breve acuse de recibo con su número de referencia y nada más." } },
        { h: { en: "Cookies and tracking", es: "Cookies y rastreo" }, p: { en: "This site uses no advertising trackers, no social-media pixels, and no third-party analytics on the appointment form. Your browser may remember your language choice and, if the connection to our server is interrupted, hold an unsent request locally until it can be delivered.", es: "Este sitio no usa rastreadores publicitarios, píxeles de redes sociales ni analítica de terceros en el formulario de citas. Su navegador puede recordar su idioma y, si se interrumpe la conexión con nuestro servidor, guardar localmente una solicitud no enviada hasta poder entregarla." } },
        { h: { en: "How long we keep it", es: "Cuánto tiempo lo conservamos" }, p: { en: "Appointment requests are kept only as long as needed to schedule and confirm your visit, after which they are removed from the website system. Your medical record itself is kept in the practice's clinical system under the practice's Notice of Privacy Practices.", es: "Las solicitudes de cita se conservan solo el tiempo necesario para programar y confirmar su visita, y luego se eliminan del sistema del sitio web. Su expediente médico se conserva en el sistema clínico del consultorio conforme al Aviso de Prácticas de Privacidad." } },
        { h: { en: "Your rights", es: "Sus derechos" }, p: { en: "You can ask what we hold about you, ask us to correct it, or ask us to delete a request you no longer want scheduled. Call the office or write to the address below. The practice's full HIPAA Notice of Privacy Practices, covering your medical record, is available at the front desk and on our forms page.", es: "Puede preguntar qué información tenemos sobre usted, pedir que la corrijamos o que eliminemos una solicitud que ya no desea programar. Llame al consultorio o escríbanos a la dirección de abajo. El Aviso de Prácticas de Privacidad completo (HIPAA), que cubre su expediente médico, está disponible en recepción y en nuestra página de formularios." } }
      ],
      updated: { en: "Effective September 2026", es: "Vigente desde septiembre de 2026" }
    },
    accessibility: {
      lede: { en: "Everyone should be able to read this site and book a visit, whatever device or assistive technology they use.", es: "Todas las personas deben poder leer este sitio y reservar una visita, sin importar el dispositivo o la tecnología de apoyo que usen." },
      sections: [
        { h: { en: "Our standard", es: "Nuestro estándar" }, p: { en: "This website is built to meet the Web Content Accessibility Guidelines (WCAG) 2.2 at level AA. Text and controls meet the contrast ratios in that standard in both light and dark themes.", es: "Este sitio web está construido para cumplir las Pautas de Accesibilidad para el Contenido Web (WCAG) 2.2 en el nivel AA. El texto y los controles cumplen las relaciones de contraste de esa norma en los temas claro y oscuro." } },
        { h: { en: "What that means in practice", es: "Qué significa en la práctica" }, list: [
          { en: "Every page and the whole booking flow work with a keyboard alone. A visible focus outline shows where you are.", es: "Todas las páginas y todo el proceso de reserva funcionan solo con el teclado. Un contorno visible muestra dónde está." },
          { en: "Headings, landmarks, labels and button names are exposed to screen readers.", es: "Los encabezados, regiones, etiquetas y nombres de botones están disponibles para lectores de pantalla." },

        ] },
        { h: { en: "In the office", es: "En el consultorio" }, p: { en: "The clinic entrance on Kamana Road is at ground level with step-free access from the parking lot. If you need an accommodation for your visit, such as extra time, a large-print form, or help completing paperwork, call ahead and we will arrange it.", es: "La entrada de la clínica en Kamana Road está a nivel del suelo con acceso sin escalones desde el estacionamiento. Si necesita una adaptación para su visita, como más tiempo, un formulario en letra grande o ayuda para llenar documentos, llame con anticipación y lo organizaremos." } },
        { h: { en: "Tell us if something is hard to use", es: "Díganos si algo es difícil de usar" }, p: { en: "If any part of this site is difficult to use, we want to know. Call the office or email us, tell us what you were trying to do and what got in the way, and we will fix it and help you complete the task another way in the meantime.", es: "Si alguna parte de este sitio es difícil de usar, queremos saberlo. Llame al consultorio o escríbanos, cuéntenos qué intentaba hacer y qué se lo impidió, y lo corregiremos mientras le ayudamos a completar la tarea de otra manera." } }

        consent: { en: "I authorize the release of the records described above. This authorization expires one year from the date signed unless I write a different date here: ________. I may revoke it in writing at any time, except where action has already been taken. Records may include information about mental health, substance use, HIV or genetic testing only if I initial here: ______. Information disclosed under this authorization may be re-disclosed by the recipient and may no longer be protected by federal privacy rules.", es: "Autorizo la divulgación de los expedientes descritos arriba. Esta autorización vence un año después de la fecha de firma salvo que escriba otra fecha aquí: ________. Puedo revocarla por escrito en cualquier momento, salvo cuando ya se haya actuado con base en ella. Los expedientes pueden incluir información sobre salud mental, uso de sustancias, VIH o pruebas genéticas solo si pongo mis iniciales aquí: ______. La información divulgada bajo esta autorización puede ser divulgada de nuevo por el destinatario y dejar de estar protegida por las normas federales de privacidad." }

      { id: "privacy-notice", title: { en: "Notice of Privacy Practices", es: "Aviso de prácticas de privacidad" }, desc: { en: "How your medical information may be used and disclosed, and your rights under HIPAA.", es: "Cómo puede usarse y divulgarse su información médica, y sus derechos bajo HIPAA." },
        text: [
          { h: { en: "This notice describes how medical information about you may be used and disclosed and how you can get access to this information. Please review it carefully.", es: "Este aviso describe cómo puede usarse y divulgarse su información médica y cómo puede obtener acceso a ella. Léalo con atención." } },
          { h: { en: "How we may use and disclose your health information", es: "Cómo podemos usar y divulgar su información de salud" }, p: { en: "For treatment: to provide, coordinate and manage your care, including sharing with hospitals, laboratories, pharmacies and other physicians involved in your care. For payment: to bill and collect payment from you, your insurer or another payer. For health care operations: for quality review, training, licensing and the day-to-day running of the practice. We may also contact you to remind you of appointments, to tell you about treatment options, and, in an emergency, to notify a family member or someone responsible for your care.", es: "Para tratamiento: para brindar, coordinar y administrar su atención, incluido compartir información con hospitales, laboratorios, farmacias y otros médicos involucrados. Para pago: para facturar y cobrar a usted, a su aseguradora u otro pagador. Para operaciones de atención médica: para revisión de calidad, capacitación, licencias y el funcionamiento diario del consultorio. También podemos contactarlo para recordarle citas, informarle sobre opciones de tratamiento y, en una emergencia, avisar a un familiar o a la persona responsable de su atención." } },
          { h: { en: "Uses and disclosures required or permitted by law", es: "Usos y divulgaciones exigidos o permitidos por la ley" }, p: { en: "We may disclose information without your authorization when required by law: to public health authorities for disease reporting, including reportable infectious diseases; to health oversight agencies; in response to court orders; to prevent a serious threat to health or safety; to coroners and medical examiners; for workers' compensation; and to law enforcement in limited circumstances. Any other use or disclosure, including most uses of psychotherapy notes, marketing, and sale of information, requires your written authorization, which you may revoke at any time in writing.", es: "Podemos divulgar información sin su autorización cuando la ley lo exige: a autoridades de salud pública para notificación de enfermedades, incluidas las enfermedades infecciosas de declaración obligatoria; a agencias de supervisión sanitaria; en respuesta a órdenes judiciales; para prevenir una amenaza grave a la salud o la seguridad; a médicos forenses; para compensación laboral; y a las fuerzas del orden en circunstancias limitadas. Cualquier otro uso o divulgación, incluida la mayoría de usos de notas de psicoterapia, mercadeo y venta de información, requiere su autorización por escrito, que puede revocar en cualquier momento por escrito." } },
          { h: { en: "Your rights", es: "Sus derechos" }, list: [
            { en: "To inspect and receive a copy of your medical record, usually within 30 days, in paper or electronic form. A reasonable copying fee may apply.", es: "A revisar y recibir una copia de su expediente médico, normalmente en 30 días, en papel o formato electrónico. Puede aplicarse una tarifa razonable de copiado." },
            { en: "To request a correction of information you believe is wrong or incomplete.", es: "A solicitar la corrección de información que considere errónea o incompleta." },
            { en: "To request restrictions on how we use or disclose your information. We are not required to agree, except that we must honour a request not to tell your health plan about a service you paid for in full out of pocket.", es: "A solicitar restricciones sobre cómo usamos o divulgamos su información. No estamos obligados a aceptar, salvo que debemos respetar la solicitud de no informar a su plan de salud sobre un servicio que pagó íntegramente de su bolsillo." },
            { en: "To ask that we contact you in a particular way or at a particular place, for example only by mobile phone.", es: "A pedir que lo contactemos de una manera o en un lugar específico, por ejemplo solo por celular." },
            { en: "To receive an accounting of certain disclosures we have made of your information in the previous six years.", es: "A recibir un informe de ciertas divulgaciones de su información realizadas en los últimos seis años." },
            { en: "To be notified if a breach of your unsecured health information occurs.", es: "A ser notificado si ocurre una violación de su información de salud no protegida." },
            { en: "To receive a paper copy of this notice at any time.", es: "A recibir una copia impresa de este aviso en cualquier momento." }
          ] },
          { h: { en: "Our duties", es: "Nuestras obligaciones" }, p: { en: "We are required by law to keep your health information private, to give you this notice, and to follow the notice currently in effect. We reserve the right to change this notice; the new notice will apply to all information we hold and will be posted in the office and on our website.", es: "La ley nos obliga a mantener la privacidad de su información de salud, a entregarle este aviso y a cumplir el aviso vigente. Nos reservamos el derecho de modificarlo; el nuevo aviso se aplicará a toda la información que tengamos y se publicará en el consultorio y en nuestro sitio web." } },
          { h: { en: "Questions and complaints", es: "Preguntas y quejas" }, p: { en: "If you believe your privacy rights have been violated, you may file a complaint with the practice's privacy officer at the address below, or with the Secretary of the U.S. Department of Health and Human Services, Office for Civil Rights. We will not retaliate against you for filing a complaint. Privacy officer: Mojave Medical, 16041 Kamana Rd, Apple Valley, CA 92307, (760) 688-0084.", es: "Si cree que se han violado sus derechos de privacidad, puede presentar una queja ante el oficial de privacidad del consultorio en la dirección indicada abajo, o ante el Secretario del Departamento de Salud y Servicios Humanos de EE. UU., Oficina de Derechos Civiles. No tomaremos represalias por presentar una queja. Oficial de privacidad: Mojave Medical, 16041 Kamana Rd, Apple Valley, CA 92307, (760) 688-0084." } }
        ],

  function mapCard() {
    return '<div class="map">' +
      '<a class="map-link" href="' + ADDRESS.maps + '" target="_blank" rel="noopener" aria-label="' + esc(t(C.ui.openMaps)) + '">' +
      '<span class="map-badge">' + ico("ext") + esc(t(C.ui.openMaps)) + "</span>" + MAP_SVG + "</a>" +
      '<div class="map-foot"><span class="small">' + esc(t(C.location.mapNote)) + '</span>' +
      '<a href="' + ADDRESS.dir + '" target="_blank" rel="noopener" style="display:inline-flex;gap:.4rem;align-items:center;font-weight:600">' + esc(t(C.ui.directions)) + ico("arrow") + "</a></div></div>";
  }
  function clinicPhoto() {
    return '<figure class="clinic" style="margin:0"><img src="' + CLINIC + '" alt="' + esc(t(C.location.photoAlt)) + '" loading="lazy" width="1200" height="875">' +
      '<figcaption><span>' + esc(t(C.location.photoCap)) + '</span><span class="sign">' + esc(t(C.location.signTag)) + "</span></figcaption></figure>";
  }
  function referPanel() {
    return '<div class="refer"><div><span class="eyebrow">' + esc(t(C.refer.eyebrow)) + '</span><h2 style="margin-top:.7rem;font-size:clamp(1.5rem,1.1rem + 1.3vw,2rem)">' + esc(t(C.refer.h2)) + "</h2></div>" +
      '<div><p style="color:var(--ink-2)">' + esc(t(C.refer.p)) + '</p><dl class="kv" style="margin-top:1rem"><dt>' + esc(t(C.contact.fax)) + '</dt><dd class="mono">' + FAX + "</dd><dt>" + esc(t(C.contact.phone)) + '</dt><dd><a class="mono" href="' + PHONE_TEL + '">' + PHONE + "</a></dd></dl></div></div>";
  }
  function pageHead(key, lede) {
    return '<section class="page-head"><div class="wrap"><span class="eyebrow">Mojave Medical</span><h1>' + esc(t(C.titles[key])) + "</h1>" + (lede ? '<p class="lede">' + esc(t(lede)) + "</p>" : "") + "</div></section>";
  }

  /* ---------- pages ---------- */
  function pageHome() {
    const H = C.hero, T = C.treat;
    return '<section class="hero"><div class="wrap hero-grid"><div class="hero-copy">' +
      '<span class="eyebrow">' + esc(t(H.eyebrow)) + "</span>" +

      "</div>" +
      '<div class="portrait"><div class="sand"></div><div class="ring"></div><img src="' + HEADSHOT + '" alt="Portrait of Dr. Kevin Ganesh" width="643" height="900">' +
      '<div class="tag">' + MARK() + "<div><b>" + esc(H.tagName) + "</b><span>" + esc(t(H.tagRole)) + "</span></div></div></div>" +
      "</div></section>" +

      '<section class="strip"><div class="wrap">' + C.strips.map(s => '<div class="strip-row"><span class="strip-label">' + esc(t(s.label)) + '</span><div class="strip-items">' + s.items.map(i => "<span>" + esc(i) + "</span>").join("") + "</div></div>").join("") + "</div></section>" +

      '<section class="section"><div class="wrap"><div class="section-head"><span class="eyebrow">' + esc(t(T.eyebrow)) + "</span><h2>" + esc(t(T.h2)) + '</h2><p class="lede">' + esc(t(T.lede)) + "</p></div>" +
      '<div class="bento"><a class="tile tile-big" href="#/services">' + SUN + '<div><div class="ico">' + ico("wound") + "</div><h3>" + esc(t(T.big.h)) + "</h3><p>" + esc(t(T.big.p)) + '</p><div class="list">' + T.big.tags.map(x => "<span>" + esc(t(x)) + "</span>").join("") + '</div></div><span class="more">' + esc(t(C.ui.learn)) + ico("arrow") + "</span></a>" +
      T.tiles.map(x => '<a class="tile' + (x.sand ? " tile-sand" : "") + '" href="#/services"><div class="ico">' + ico(x.ico) + "</div><h3>" + esc(t(x.h)) + "</h3><p>" + esc(t(x.p)) + "</p></a>").join("") +
      '</div><div style="margin-top:1.4rem"><a class="btn btn-ghost" href="#/services">' + esc(t(C.ui.seeAll)) + ico("arrow") + "</a></div></div></section>" +

  /* ---------- booking ---------- */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const BOOK_OPENED = Date.now();
  const B = { step: 0, type: null, date: null, time: null, form: {}, errors: {}, done: null, month: new Date(today.getFullYear(), today.getMonth(), 1) };
  const typeOf = id => C.book.types.find(x => x.id === id);
  function slotsFor(d) {
    const dow = d.getDay(); if (dow === 0) return [];
    const start = dow === 6 ? 13 * 60 : 8 * 60, key = ymd(d), out = [];
    const now = new Date(), isToday = ymd(now) === key, nowMin = now.getHours() * 60 + now.getMinutes();
    for (let m = start; m <= 16 * 60 + 30; m += 30) {
      const taken = hsh(key + ":" + m + ":mm") % 100 < 36 || (isToday && m < nowMin + 120);
      out.push({ m, taken });
    }
    return out;
  }
  const dayOk = d => { const diff = (d - today) / 864e5; return diff >= 0 && diff <= 60 && d.getDay() !== 0 && slotsFor(d).some(s => !s.taken); };

  function pageBook() {
    return pageHead("book", C.book.lede) +

  function progress() {
    return '<div class="progress" aria-hidden="true">' + C.book.stepsLabel.map((s, i) => "<div class=\"" + (i < B.step ? "done" : i === B.step ? "on" : "") + '">' + esc(t(s)) + "</div>").join("") + "</div>";
  }
  function bookMain() {
    if (B.done) return success();
    const K = C.book;
    let body = "";
    if (B.step === 0) {
      body = "<h2 style=\"font-size:1.6rem;margin-bottom:1rem\">" + esc(t(K.s1)) + '</h2><div class="opts">' + K.types.map(x =>
        '<button type="button" class="opt" data-type="' + x.id + '" aria-pressed="' + (B.type === x.id) + '"><b>' + esc(t(x.h)) + "</b><span>" + esc(t(x.s)) + '</span><span class="dur">' + x.dur + " " + esc(t(K.min)) + (x.id === "video" ? " · " + esc(t(C.ui.telehealth)) : "") + "</span></button>").join("") + "</div>";
    } else if (B.step === 1) {
      body = "<h2 style=\"font-size:1.6rem;margin-bottom:1rem\">" + esc(t(K.s2)) + '</h2><div class="cal-wrap">' + calendar() + '<div class="slots" id="slots">' + slotList() + "</div></div>";
    } else if (B.step === 2) {
      body = "<h2 style=\"font-size:1.6rem;margin-bottom:1rem\">" + esc(t(K.s3)) + "</h2>" + detailsForm();
    } else {
      body = "<h2 style=\"font-size:1.6rem;margin-bottom:1rem\">" + esc(t(K.s4)) + '</h2><div class="note" style="margin-bottom:1rem">' + ico("info") + "<span>" + esc(t(K.reviewNote)) + "</span></div>" + summary(true);
    }
    const canNext = B.step === 0 ? !!B.type : B.step === 1 ? !!(B.date && B.time != null) : true;
    return progress() + body +
      '<div class="book-nav"><div>' + (B.step > 0 ? '<button type="button" class="btn btn-ghost" data-nav="back">' + ico("chevL") + esc(t(K.back)) + "</button>" : "") + "</div>" +
      "<div>" + (B.step < 3 ? '<button type="button" class="btn btn-ink" data-nav="next"' + (canNext ? "" : " disabled") + ">" + esc(t(K.next)) + ico("arrow") + "</button>" : '<button type="button" class="btn btn-amber btn-lg" data-nav="send">' + ico("cal") + esc(t(K.send)) + "</button>") + "</div></div>";
  }
  function calendar() {
    const m = B.month, y = m.getFullYear(), mo = m.getMonth();
    const first = new Date(y, mo, 1), startDow = first.getDay(), days = new Date(y, mo + 1, 0).getDate();
    const minMonth = new Date(today.getFullYear(), today.getMonth(), 1), maxMonth = new Date(today.getFullYear(), today.getMonth() + 2, 1);
    let cells = "";
    for (let i = 0; i < startDow; i++) cells += "<span></span>";
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, mo, d), ok = dayOk(dt), key = ymd(dt);
      cells += '<button type="button" class="day' + (ok ? " avail" : "") + (key === ymd(today) ? " today" : "") + '" data-day="' + key + '"' + (ok ? "" : " disabled") + ' aria-pressed="' + (B.date === key) + '" aria-label="' + esc(fmtDate(dt)) + '">' + d + "</button>";
    }
    return '<div class="cal"><div class="cal-head"><button type="button" data-month="-1"' + (m <= minMonth ? " disabled" : "") + ' aria-label="Previous month">' + ico("chevL") + "</button><b>" + esc(t(C.ui.months)[mo]) + " " + y + '</b><button type="button" data-month="1"' + (m >= maxMonth ? " disabled" : "") + ' aria-label="Next month">' + ico("chevR") + "</button></div>" +
      '<div class="cal-grid">' + t(C.ui.dow).map(x => '<span class="dow">' + x + "</span>").join("") + cells + "</div>" +
      '<p class="small" style="margin-top:.7rem">' + esc(t(C.book.pickDay)) + "</p></div>";
  }
  function slotList() {
    if (!B.date) return '<div class="slot-empty">' + esc(t(C.book.pickDay)) + "</div>";
    const d = fromYmd(B.date), s = slotsFor(d);
    if (!s.some(x => !x.taken)) return '<div class="slot-empty">' + esc(t(C.book.noSlots)) + "</div>";
    return "<h4>" + esc(t(C.book.timesFor)) + " " + esc(fmtDate(d)) + '</h4><div class="slot-grid">' + s.map(x => '<button type="button" class="slot" data-time="' + x.m + '"' + (x.taken ? " disabled" : "") + ' aria-pressed="' + (B.time === x.m) + '">' + fmtTime(x.m) + "</button>").join("") + "</div>";
  }
  function field(name, label, input, hint) {
    const err = B.errors[name];
    return '<div class="field' + (err ? " err" : "") + '"><label for="f-' + name + '">' + esc(t(label)) + "</label>" + input + (hint ? '<span class="hint">' + esc(t(hint)) + "</span>" : "") + (err ? '<span class="err-msg">' + esc(err) + "</span>" : "") + "</div>";

  function detailsForm() {
    const F = C.book.f, v = n => esc(B.form[n] || "");
    const inp = (n, type, extra) => '<input id="f-' + n + '" name="' + n + '" type="' + (type || "text") + '" value="' + v(n) + '" ' + (extra || "") + ">";
    const insOpts = ['<option value="">—</option>'].concat(C.insurance.carriers.map(c => '<option' + (B.form.ins === c ? " selected" : "") + ">" + esc(c) + "</option>"), ['<option value="selfpay"' + (B.form.ins === "selfpay" ? " selected" : "") + ">" + esc(t(F.selfpay)) + "</option>", '<option value="other"' + (B.form.ins === "other" ? " selected" : "") + ">" + esc(t(F.other)) + "</option>"]).join("");
    return '<form class="form-grid" id="details" novalidate>' +
      field("first", F.first, inp("first", "text", 'autocomplete="given-name" required')) +
      field("last", F.last, inp("last", "text", 'autocomplete="family-name" required')) +
      field("dob", F.dob, inp("dob", "date", 'autocomplete="bday" required')) +
      field("phone", F.phone, inp("phone", "tel", 'autocomplete="tel" inputmode="tel" required')) +
      field("email", F.email, inp("email", "email", 'autocomplete="email"')) +
      field("ins", F.ins, '<select id="f-ins" name="ins">' + insOpts + "</select>") +
      '<div class="field full"><span style="font-weight:600;font-size:.92rem">' + esc(t(F.status)) + '</span><div class="opts" style="margin-top:.3rem"><button type="button" class="opt" data-status="new" aria-pressed="' + (B.form.status !== "est") + '"><b>' + esc(t(F.newp)) + '</b></button><button type="button" class="opt" data-status="est" aria-pressed="' + (B.form.status === "est") + '"><b>' + esc(t(F.estp)) + "</b></button></div></div>" +
      '<div class="full">' + field("ref", F.ref, inp("ref", "text")) + "</div>" +
      '<div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label for="f-company">Company</label><input id="f-company" name="company" type="text" tabindex="-1" autocomplete="off" value="' + v("company") + '"></div>' +
      '<div class="full">' + field("reason", F.reason, '<textarea id="f-reason" name="reason" rows="2" maxlength="140">' + v("reason") + "</textarea>", F.reasonHint) + "</div>" +
      '<div class="full field' + (B.errors.consent ? " err" : "") + '"><label style="display:flex;gap:.6rem;align-items:flex-start;font-weight:400;font-size:.92rem"><input type="checkbox" id="f-consent" name="consent" style="width:auto;margin-top:.25rem"' + (B.form.consent ? " checked" : "") + ">" + esc(t(F.consent)) + "</label>" + (B.errors.consent ? '<span class="err-msg">' + esc(B.errors.consent) + "</span>" : "") + "</div>" +
      "</form>";
  }
  function validate() {
    const F = C.book.f, f = B.form, e = {};
    ["first", "last", "dob", "phone"].forEach(n => { if (!(f[n] || "").trim()) e[n] = t(F.req); });
    if (f.phone && (f.phone.replace(/\D/g, "").length < 10)) e.phone = t(F.badPhone);
    if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = t(F.badEmail);
    if (!f.consent) e.consent = t(F.req);
    B.errors = e; return !Object.keys(e).length;
  }
  function summary(full) {
    const K = C.book, L = K.labels, ty = typeOf(B.type), f = B.form;
    const row = (k, v) => "<dt>" + esc(t(k)) + "</dt><dd" + (v ? "" : ' class="empty"') + ">" + (v ? esc(v) : esc(t(K.notChosen))) + "</dd>";
    const insLabel = f.ins === "selfpay" ? t(K.f.selfpay) : f.ins === "other" ? t(K.f.other) : f.ins;
    return '<div class="summary"><h3 style="font-size:1.05rem;font-family:var(--sans);font-weight:600;margin-bottom:.8rem">' + esc(t(K.summaryTitle)) + "</h3><dl>" +
      row(L.type, ty && t(ty.h)) + row(L.dur, ty && ty.dur + " " + t(K.min)) +
      row(L.when, B.date && B.time != null ? fmtDate(fromYmd(B.date)) + " · " + fmtTime(B.time) : "") +
      row(L.where, ty ? (ty.id === "video" ? t(K.byVideo) : t(K.inOffice)) : "") +
      (full ? row(L.who, ((f.first || "") + " " + (f.last || "")).trim() + (f.phone ? " · " + f.phone : "")) + row(L.ins, insLabel) : "") +
      "</dl></div>";
  }
  function success() {
    const K = C.book;
    return '<div class="success"><div class="big-check">' + ico("check") + "</div><h2>" + esc(t(K.doneH)) + '</h2><p class="lede">' + esc(t(K.doneP)) + '</p><span class="ref">' + esc(t(K.refNo)) + " " + esc(B.done) + "</span>" +
      (B.offline ? '<div class="note amber">' + ico("info") + "<span>" + esc(t(K.offline)) + "</span></div>" : "") + summary(true) +
      '<div class="flex"><a class="btn btn-ink" href="' + PHONE_TEL + '">' + ico("phone") + PHONE + '</a><button type="button" class="btn btn-ghost" data-nav="reset">' + esc(t(K.another)) + "</button></div></div>";
  }
  function rerenderBook() { const el = $("#book-main"); if (el) { el.innerHTML = bookMain(); el.scrollIntoView({ block: "start", behavior: "smooth" }); } }
  function onBookClick(e) {
    const b = e.target.closest("[data-type],[data-day],[data-time],[data-month],[data-nav],[data-status]"); if (!b || b.disabled) return;
    if (b.dataset.type) { B.type = b.dataset.type; rerenderBook(); }
    else if (b.dataset.day) { B.date = b.dataset.day; B.time = null; rerenderBook(); }
    else if (b.dataset.time) { B.time = +b.dataset.time; rerenderBook(); }
    else if (b.dataset.month) { B.month = new Date(B.month.getFullYear(), B.month.getMonth() + (+b.dataset.month), 1); rerenderBook(); }
    else if (b.dataset.status) { B.form.status = b.dataset.status; rerenderBook(); }
    else if (b.dataset.nav === "back") { B.step = Math.max(0, B.step - 1); rerenderBook(); }
    else if (b.dataset.nav === "next") {
      if (B.step === 2 && !validate()) { rerenderBook(); const first = $("#book-main .field.err input, #book-main .field.err select"); if (first) first.focus(); return; }
      B.step = Math.min(3, B.step + 1); rerenderBook();
    }
    else if (b.dataset.nav === "send") { submitBooking(b); }
    else if (b.dataset.nav === "reset") { Object.assign(B, { step: 0, type: null, date: null, time: null, form: {}, errors: {}, done: null }); rerenderBook(); }
  }
  async function submitBooking(btn) {
    if (B.sending) return;
    B.sending = true;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = lang === "es" ? "Enviando…" : "Sending…";
    const payload = {
      visit_type: B.type,
      requested_date: B.date,
      requested_time: B.time == null ? null : Math.floor(B.time / 60) + ":" + pad(B.time % 60),
      first_name: B.form.first, last_name: B.form.last, dob: B.form.dob,
      phone: B.form.phone, email: B.form.email, insurance: B.form.ins,
      patient_status: B.form.status === "est" ? "est" : "new",
      referred_by: B.form.ref, reason: B.form.reason,
      consent: !!B.form.consent, lang: lang,
      company: B.form.company || "",          // honeypot: must stay empty
      elapsed_ms: Date.now() - BOOK_OPENED,
      source: "website"
    };
    try {
      const r = await fetch("/api/appointments", {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ref) { B.done = data.ref; B.offline = false; }
      else if (r.status === 422 && data.errors) {
        const map = { first_name: "first", last_name: "last", dob: "dob", phone: "phone", email: "email", consent: "consent" };
        B.errors = {}; Object.keys(data.errors).forEach(k => { B.errors[map[k] || k] = data.errors[k]; });
        B.step = 2; B.sending = false; rerenderBook(); toast(data.error || "Please check the form."); return;
      } else if (r.status === 429) { B.sending = false; btn.disabled = false; btn.innerHTML = original; toast(data.error || "Too many requests. Please call the office."); return; }
      else throw new Error(data.error || ("HTTP " + r.status));
    } catch (err) {
      // No backend (static preview, or the API is down): keep the request locally so nothing is lost.
      B.done = "MM-" + Date.now().toString(36).toUpperCase().slice(-6);
      B.offline = true;
      try {
        const arr = JSON.parse(localStorage.getItem("mm_requests") || "[]");
        arr.push({ ref: B.done, at: new Date().toISOString(), payload });
        localStorage.setItem("mm_requests", JSON.stringify(arr.slice(-20)));
      } catch (e2) {}
    }
    B.sending = false;
    rerenderBook();
    toast(t(C.book.doneH));
  }

  function onBookInput(e) {
    const el = e.target; if (!el.name || !el.closest("#details")) return;
    B.form[el.name] = el.type === "checkbox" ? el.checked : el.value;
    if (B.errors[el.name]) { delete B.errors[el.name]; const f = el.closest(".field"); if (f) { f.classList.remove("err"); const m = f.querySelector(".err-msg"); if (m) m.remove(); } }
  }

  /* ---------- chrome ---------- */
  function currentPage() { const h = location.hash.replace(/^#\/?/, ""); return h.split("/")[0] || "home"; }
  function renderChrome() {
    const cur = currentPage();
    document.documentElement.lang = lang;
    $("#nav").innerHTML = C.nav.map(n => '<a href="#/' + (n.id === "home" ? "" : n.id) + '"' + (cur === n.id ? ' aria-current="page"' : "") + ">" + esc(t(n)) + "</a>").join("");
    $("#brand-shield").innerHTML = '<img src="' + EMBLEM + '" alt="" aria-hidden="true" width="191" height="252">';
    $("#brand-virus").innerHTML = '<img class="spin" src="' + VIRUS_MARK + '" alt="" aria-hidden="true" width="87" height="87">';
    $("#head-call").innerHTML = ico("phone") + PHONE;
    $("#head-book").textContent = t(C.ui.book);
    $("#menu-btn").innerHTML = ico($("#site-head").classList.contains("open") ? "x" : "menu");
    $("#menu-btn").setAttribute("aria-label", t(C.ui.menu));
    $(".skip").textContent = t(C.ui.skip);
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("#mobile-bar").innerHTML = '<a class="btn btn-ghost" href="' + PHONE_TEL + '">' + ico("phone") + esc(t(C.ui.call)) + '</a><a class="btn btn-amber" href="#/book">' + ico("cal") + esc(t(C.ui.book)) + "</a>";
    const F = C.footer;
    $("#site-foot").innerHTML = '<div class="wrap foot-grid"><div><a class="foot-lockup" href="#/" aria-label="Mojave Medical home">' + LOCKUP() + '</a><p class="small" style="max-width:34ch">' + esc(t(F.tag)) + '</p><address class="addr small" style="margin-top:1rem">' + esc(ADDRESS.line1) + "<br>" + esc(ADDRESS.city) + "</address></div>" +
      "<div><h4>" + esc(t(F.pages)) + "</h4><ul>" + [{ id: "home", en: "Home", es: "Inicio" }].concat(C.nav).map(n => '<li><a href="#/' + (n.id === "home" ? "" : n.id) + '">' + esc(t(n)) + "</a></li>").join("") + "</ul></div>" +
      "<div><h4>" + esc(t(F.patientsCol)) + "</h4><ul>" + F.links.map(l => '<li><a href="' + l.href + '">' + esc(t(l)) + "</a></li>").join("") + '<li><a href="#/forms">' + esc(t(F.formsLink)) + "</a></li>" + "</ul></div>" +
      "<div><h4>" + esc(t(F.contactCol)) + '</h4><ul><li><a class="mono" href="' + PHONE_TEL + '">' + PHONE + '</a></li><li class="mono small">' + esc(t(C.contact.fax)) + " " + FAX + '</li><li><a href="mailto:' + EMAIL + '" style="word-break:break-all">' + EMAIL + '</a></li><li class="small">' + esc(t(C.ui.days)[1]) + "–" + esc(t(C.ui.days)[5]) + " " + esc(hoursRow(1)) + "<br>" + esc(t(C.ui.days)[6]) + " " + esc(hoursRow(6)) + "</li></ul></div></div>" +
      '<div class="wrap foot-bottom"><span>' + esc(t(F.legal)) + '</span><span style="display:flex;gap:1.2rem;flex-wrap:wrap"><a href="#/privacy">' + esc(t(F.privacy)) + '</a><a href="#/accessibility">' + esc(t(F.access)) + '</a><a href="#/forms">' + esc(t(F.formsLink)) + '</a><a href="' + ADDRESS.maps + '" target="_blank" rel="noopener">' + esc(t(F.google)) + "</a></span></div>";
  }
  const PAGES = { home: pageHome, about: pageAbout, services: pageServices, patients: pagePatients, reviews: pageReviews, contact: pageContact, book: pageBook, privacy: pagePrivacy, accessibility: pageAccessibility, forms: () => pageForms(ROUTE_ARG) };
  let ROUTE_ARG = null;
  function route() {
    const h = location.hash.replace(/^#\/?/, ""), parts = h.split("/"), name = PAGES[parts[0]] ? parts[0] : "home";
    if (name === "book" && parts[1] && typeOf(parts[1])) { B.type = parts[1]; if (B.step === 0 && !B.done) B.step = 1; }
    ROUTE_ARG = parts[1] || null;
    const main = $("#main");
    main.classList.remove("page"); void main.offsetWidth; main.classList.add("page");
    main.innerHTML = PAGES[name]();
    document.title = "Mojave Medical · " + t(C.titles[name]);
    $("#site-head").classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded", "false");
    renderChrome();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
  document.addEventListener("click", e => {
    const lb = e.target.closest(".lang button"); if (lb) { lang = lb.dataset.lang; try { localStorage.setItem("mm_lang", lang); } catch (err) {} route(); return; }
    if (e.target.closest("#menu-btn")) { const hd = $("#site-head"); const open = hd.classList.toggle("open"); $("#menu-btn").setAttribute("aria-expanded", String(open)); $("#menu-btn").innerHTML = ico(open ? "x" : "menu"); return; }
    if (e.target.closest("#book-main")) onBookClick(e);
  });
  document.addEventListener("input", onBookInput);
  document.addEventListener("change", onBookInput);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
